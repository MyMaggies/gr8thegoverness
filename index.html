<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Governess - Interactive Quiz</title>
    <style>
        :root {
            --bg-color: #FFF9D1; 
            --header-color: #FEE066; 
            --border-color: #000000;
            --accent-pink: #E9D5D8;
        }

        body {
            background-color: #7B8D9E;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .window {
            width: 95%;
            max-width: 650px;
            background-color: var(--bg-color);
            border: 3px solid var(--border-color);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            background-color: var(--header-color);
            border-bottom: 3px solid var(--border-color);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .close-icon {
            border: 2px solid var(--border-color);
            padding: 0px 8px;
            cursor: pointer;
        }

        .content {
            padding: 30px 50px 30px 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .question-meta {
            font-size: 0.85rem;
            margin-bottom: 10px;
            color: #555;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.3;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-card {
            border: 2px solid var(--border-color);
            padding: 10px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .option-card:hover {
            background-color: var(--header-color);
        }

        .option-letter {
            font-weight: bold;
            margin-right: 15px;
            border-right: 2px solid var(--border-color);
            padding-right: 10px;
        }

        .side-nav {
            position: absolute;
            right: 0;
            top: 40px;
            bottom: 0;
            width: 35px;
            background-color: var(--bg-color);
            border-left: 3px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .scroll-btn {
            height: 35px;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: var(--accent-pink);
        }

        /* Scaffolding Styles */
        .scaffold-box {
            margin-top: 15px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px dashed var(--border-color);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .scaffold-title {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 5px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 80px;
            border: 2px solid var(--border-color);
            padding: 10px;
            font-family: inherit;
            resize: none;
        }

        .submit-btn {
            margin-top: 10px;
            background: var(--header-color);
            border: 2px solid var(--border-color);
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .feedback { margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="window">
    <div class="window-header">
        <span>The Governess Quiz</span>
        <div class="close-icon" onclick="location.reload()">X</div>
    </div>
    
    <div class="content">
        <div id="quiz-container">
            <div id="q-header" class="question-meta"></div>
            <div id="q-text" class="question-text"></div>
            <div id="q-options" class="options-grid"></div>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <div class="side-nav">
        <div class="scroll-btn" onclick="prevQuestion()">▲</div>
        <div class="scroll-btn" onclick="nextQuestion()">▼</div>
    </div>
</div>

<script>
    const quizData = [
        {
            meta: "Q1 | Julia's Pay",
            q: "Julia is supposed to receive how much pay each month?",
            options: ["10 rubles", "20 rubles", "40 rubles"],
            correct: 2 
        },
        {
            meta: "Q2 | Character Inference",
            q: "Why doesn't Julia speak up for herself?",
            options: ["She agrees with Mistress", "She fears losing her job", "She doesn't understand"],
            correct: 1
        },
        {
            meta: "Q3 | Character Analysis",
            q: "Why does Julia keep her head down?",
            options: ["She is shy", "She is afraid", "She is bored"],
            correct: 1
        },
        {
            meta: "Q4 | Bonus Analysis",
            q: "Character Analysis: Describe the Mistress.",
            type: "text"
        }
    ];

    let currentIdx = 0;

    function render() {
        const data = quizData[currentIdx];
        const container = document.getElementById('quiz-container');
        document.getElementById('q-header').innerText = data.meta;
        document.getElementById('q-text').innerText = data.q;
        
        const optionsBox = document.getElementById('q-options');
        optionsBox.innerHTML = "";
        document.getElementById('feedback').innerText = "";

        if (data.type === "text") {
            const area = document.createElement('textarea');
            area.placeholder = "Write your analysis here...";
            optionsBox.appendChild(area);

            // The Scaffolded Model
            const scaffold = document.createElement('div');
            scaffold.className = "scaffold-box";
            scaffold.innerHTML = `
                <span class="scaffold-title">Writing Model:</span>
                The Mistress can be described as <strong>[strict/authoritative]</strong> because she 
                intentionally cheats Julia. Her goal is to teach Julia to <strong>[speak up/be strong]</strong> 
                and stop being so <strong>[frightened/submissive]</strong>.
            `;
            optionsBox.appendChild(scaffold);
            
            const btn = document.createElement('div');
            btn.className = "submit-btn";
            btn.innerText = "SUBMIT & FINISH";
            btn.onclick = () => {
                container.innerHTML = "<h2>Challenge Complete</h2><p>You have successfully analyzed the power dynamics between Julia and the Mistress.</p>";
            };
            optionsBox.appendChild(btn);
        } else {
            data.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = "option-card";
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span> <span>${opt}</span>`;
                div.onclick = () => check(i);
                optionsBox.appendChild(div);
            });
        }
    }

    function check(i) {
        const feedback = document.getElementById('feedback');
        if (i === quizData[currentIdx].correct) {
            feedback.style.color = "green";
            feedback.innerText = "CORRECT!";
            setTimeout(nextQuestion, 800);
        } else {
            feedback.style.color = "red";
            feedback.innerText = "TRY AGAIN";
        }
    }

    function nextQuestion() {
        if (currentIdx < quizData.length - 1) {
            currentIdx++;
            render();
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            render();
        }
    }

    render();
</script>

</body>
</html>
